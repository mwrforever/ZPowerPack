<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>ZPowerPack · 用量看板</title>
<style>
/* ===== V2 卡片看板（AI Usage Widget 形态；设计稿 §五.1 布局图与四区说明为唯一权威）=====
   单文件自包含铁律：宿主对 entry 形态视图只伺服 pageUri 与注册资源，外链 script/字体必失败
   （V1 探针实证）→ 图标/环形/折线全部内联 SVG，字体走本地栈，数字一律 tabular-nums。
   沙箱哑渲染铁律：文案/阈值/格式化全部在扩展侧 view-model 完成（Node 侧可 TDD），
   本文件只做 DOM 绑定与坐标换算，零文案计算。构图：深色大圆角卡片四区
   （速率条/厂商行/24h 趋势/结论句）+ 右上角手动同步按钮。 */
*{margin:0;box-sizing:border-box}
::selection{background:rgba(110,231,255,.3)}
:focus-visible{outline:1px solid rgba(110,231,255,.6);outline-offset:2px}
body{background:#070a12;color:#e8edf6;font:14px/1.55 Manrope,"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 20px}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(60% 34% at 24% 12%,rgba(110,231,255,.07),transparent 62%),radial-gradient(50% 30% at 82% 78%,rgba(167,139,255,.06),transparent 62%);pointer-events:none}

/* ===== 卡片骨架：四区以细分隔线相接（§五.1 草图的 ├─┤ 分隔形态）===== */
.card{width:100%;max-width:720px;background:#0c1220;border:1px solid rgba(140,180,255,.13);border-radius:24px;box-shadow:0 24px 70px rgba(0,0,0,.5);overflow:hidden;position:relative;z-index:1}
.sec{padding:16px 22px}
.sec + .sec{border-top:1px solid rgba(140,180,255,.1)}

/* ===== 区一 · 速率条：呼吸圆点 + 合计巨字 + 活跃流并列 + 活动时刻 ===== */
.rate-line{display:flex;align-items:center;gap:12px;min-height:34px}
.dot{width:9px;height:9px;border-radius:50%;background:#34e3a2;box-shadow:0 0 10px rgba(52,227,162,.75);flex-shrink:0;animation:breath 1.6s ease-in-out infinite}
.rate-state{font-size:11.5px;color:#8fa3c8;border:1px solid rgba(140,180,255,.2);border-radius:999px;padding:2px 10px;flex-shrink:0;white-space:nowrap}
.rate-total{font:700 30px/1 "Cascadia Code","Chakra Petch",Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:#f7faff;white-space:nowrap}
.rate-model{font-size:13px;color:#8fa3c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rate-streams{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:#8fa3c8}
.rate-streams .st b{color:#dbe6f5;font-family:"Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums}
.rate-streams .st .sub{color:#6d7fa3;margin-left:4px}
.meta{margin-top:10px;font-size:12px;color:#6d7fa3}

/* ===== 区二 · 厂商行：内联 SVG 环（stroke-dasharray=5h 已用%）+ 状态句 + 右对齐百分比枚举 ===== */
.vendor{display:flex;align-items:center;gap:14px;padding:13px 0}
.vendor + .vendor{border-top:1px solid rgba(140,180,255,.08)}
.ring{width:44px;height:44px;flex-shrink:0}
.ring circle{fill:none;stroke-width:3.4}
.ring .ring-bg{stroke:rgba(140,180,255,.14)}
.ring.ring-empty .ring-bg{opacity:.55}
.ring .ring-fg{stroke-linecap:round;transition:stroke-dasharray .3s ease,stroke .3s ease}
.v-info{min-width:0;flex:1}
.v-name{font-size:14px;font-weight:700;color:#e8edf6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-status{margin-top:4px;font-size:12px;color:#9db4dd}
.v-sub{margin-top:3px;font-size:11.5px;color:#6d7fa3}
.v-percs{flex-shrink:0;display:flex;gap:6px;text-align:right;font-size:12.5px;color:#9db4dd}
.v-percs .perc{white-space:nowrap}
.v-percs .perc i{font-style:normal;color:#6d7fa3;margin-right:4px}
.v-percs .perc b{color:#e8edf6;font-weight:600;font-variant-numeric:tabular-nums}
.v-empty{padding:12px 0;font-size:12.5px;color:#6d7fa3}

/* ===== 区三 · 24h 趋势：内联 SVG 面积折线（橙色系；坐标由脚本按 token 数哑映射）===== */
.trend-svg{width:100%;height:120px;display:block;margin-top:10px}
.trend-svg path{transition:opacity .3s ease}

/* ===== 区四 · 结论句 ===== */
.conclusion{font-size:13px;color:#cfe0f2}
.conclusion::before{content:"◈";color:#ff8f6b;margin-right:8px}

/* ===== 手动同步按钮（右上角）：拉取中 disabled+旋转图标，10s 超时复位 ===== */
.sync-btn{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 13px;border-radius:999px;border:1px solid rgba(140,180,255,.22);background:rgba(22,30,48,.75);color:#9db4dd;font-size:12px;font-family:inherit;cursor:pointer;flex-shrink:0}
.sync-btn:hover:not(:disabled){border-color:rgba(110,231,255,.45);color:#6ee7ff}
.sync-btn:disabled{cursor:default;opacity:.6}
.sync-btn .sync-icon{animation:none}
.sync-btn.busy .sync-icon{animation:spin 1s linear infinite}

/* ===== 数字过渡类：静态数字节点挂 num-t，值变化经 300ms 淡入上屏（动态重建节点不参与）===== */
.num-t{transition:opacity .3s ease}

/* ===== 功能动画仅两枚：呼吸圆点 + 同步旋转；prefers-reduced-motion 下全部关闭 ===== */
@keyframes breath{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ===== 同步失败 toast 与首帧连接遮罩 ===== */
.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);background:#1a2233;border:1px solid rgba(255,143,107,.45);color:#ffc9b5;padding:9px 18px;border-radius:12px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:9}
.toast.show{opacity:1;transform:translate(-50%,0)}
#boot{position:fixed;inset:0;background:#070a12;display:flex;align-items:center;justify-content:center;color:#6d7fa3;font-size:13px;z-index:8;transition:opacity .4s}
#boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="boot">正在连接数据通道…</div>

<div class="card">
  <!-- 区一 · 速率条：呼吸圆点（活跃流在飞）+ 合计巨字 + 手动同步按钮（§五.1 右上角） -->
  <div class="sec" data-testid="rate-bar">
    <div class="rate-line">
      <i class="dot" id="rate-dot" style="display:none"></i>
      <span class="rate-state num-t" id="rate-state">—</span>
      <b class="rate-total num-t" id="rate-total"></b>
      <span class="rate-model" id="rate-model"></span>
      <button class="sync-btn" id="sync-btn" data-testid="sync-btn" title="立即拉取官方额度" aria-label="手动同步官方额度">手动同步
        <svg class="sync-icon" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.7-4"/><path d="M13.6 1.6v2.7h-2.7"/></svg>
      </button>
    </div>
    <div class="rate-streams" id="rate-streams" style="display:none"></div>
    <div class="meta num-t" id="rate-meta" style="display:none"></div>
  </div>

  <!-- 区二 · 厂商行：脚本按 panel.vendors 实例化（行模板带 data-testid="vendor-row"） -->
  <div class="sec" id="vendor-list"></div>

  <!-- 区三 · 24h 趋势：内联 SVG 面积折线（无外链）；foot 累计句来自 view-model -->
  <div class="sec">
    <svg class="trend-svg" data-testid="trend-chart" id="trend-chart" viewBox="0 0 640 120" preserveAspectRatio="none" role="img" aria-label="近 24 小时 token 消耗趋势">
      <defs>
        <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff8f6b" stop-opacity=".35"/>
          <stop offset="1" stop-color="#ff8f6b" stop-opacity=".02"/>
        </linearGradient>
      </defs>
      <path id="trend-fill" fill="url(#tg)" d=""/>
      <path id="trend-line" fill="none" stroke="#ff8f6b" stroke-width="2" stroke-linejoin="round" d=""/>
    </svg>
    <div class="meta num-t" id="trend-foot"></div>
  </div>

  <!-- 区四 · 结论句（view-model 外推文案直渲） -->
  <div class="sec conclusion num-t" data-testid="conclusion-line" id="conclusion-line">—</div>
</div>

<div id="toast" class="toast" role="alert"></div>

<script>
"use strict";
/* 沙箱哑渲染（V2）：唯一取数通道 = 注册资源 zpowerpack://display（宿主 MCP 桥），
   展示模型 {strip, panel} 的全部文案/阈值/格式化已在扩展侧 view-model 完成，本脚本
   只做 DOM 绑定、SVG 坐标换算与通道管理。取数双保险（扩展侧 notify 推送链宿主实证 +
   沙箱 window.zcode 订阅入口暴露性未证实）：①启动时 typeof 探测一切可用订阅形态，
   任何失败静默跳过；②无论订阅成败保留 1s 轻轮询兜底（V2 载荷小，无压力）。 */

var POLL_FALLBACK_MS = 1000; // 轮询兜底节奏：订阅不可达/丢通知时数据新鲜度的下限
var SYNC_TIMEOUT_MS = 10000; // 同步按钮超时复位：readResource 悬挂时按钮不得永久禁用
var TOAST_MS = 4000;         // 失败提示停留时长
var RING_C = 100;            // 环周长归一（r=15.9 → 2πr≈100）：stroke-dasharray 直接用百分比

var el = function (id) { return document.getElementById(id); };

/** 注册资源读取（宿主 MCP 桥）：display=展示模型 JSON 主通道，sync=手动同步触发通道 */
function readResource(uri) {
  var z = window.zcode;
  if (!z || typeof z.readResource !== "function") return Promise.reject(new Error("window.zcode 不可用"));
  return z.readResource(uri).then(function (resp) {
    var text = resp && resp.contents && resp.contents[0] && resp.contents[0].text;
    if (!text) throw new Error("资源响应为空");
    return text;
  });
}

/** 取数主通道：display 展示模型（{strip, panel}，字段全由扩展侧备好） */
function readDisplay() {
  return readResource("zpowerpack://display").then(function (text) { return JSON.parse(text); });
}

/** HTML 转义：展示模型的名称类字段进入 innerHTML 模板前一律过此関 */
function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/**
 * 数字/文本节点更新：值变化时经 300ms 透明度过渡上屏（num-t 类），同值不动。
 * prefers-reduced-motion 下过渡被 CSS 全关，赋值即时生效，无动画副作用。
 */
function setNum(node, text) {
  if (node.textContent === text) return;
  node.textContent = text;
  node.style.opacity = ".45";
  void node.offsetWidth; // 强制回流，让过渡从半透明起点开始
  node.style.opacity = "1";
}

/** 区一 · 速率条：圆点=活跃流在飞；头行=合计/末值（单流并入模型名）；次行=多流并列；三行=活动时刻 */
var lastStreamsHtml = "";
function renderRate(rate) {
  rate = rate || {}; // 段缺失防御：display 载荷异常时退化为空态，不得抛错卡住整屏
  var streams = Array.isArray(rate.streams) ? rate.streams : [];
  el("rate-dot").style.display = streams.length > 0 ? "" : "none";
  setNum(el("rate-state"), rate.stateText === null || rate.stateText === undefined ? "" : rate.stateText);
  setNum(el("rate-total"), rate.totalText === null || rate.totalText === undefined ? "" : rate.totalText);
  // 单流时模型名并入头行（§五.1「428 tok/s · glm-4.7」）；多流并列在次行（§五.2 多流口径 a）
  el("rate-model").textContent = streams.length === 1 ? "· " + streams[0].modelId : "";
  var html = streams.length > 1
    ? streams.map(function (s) {
        return '<span class="st">' + esc(s.modelId) + " <b>" + esc(s.tpsText) + "</b> tok/s" +
          (s.isSubText ? '<span class="sub">（' + esc(s.isSubText) + "）</span>" : "") + "</span>";
      }).join("")
    : "";
  if (html !== lastStreamsHtml) {
    lastStreamsHtml = html;
    var box = el("rate-streams");
    box.innerHTML = html;
    box.style.display = html === "" ? "none" : "";
  }
  var meta = el("rate-meta");
  var metaText = rate.lastActivityText === null || rate.lastActivityText === undefined ? "" : rate.lastActivityText;
  if (meta.textContent !== metaText) {
    meta.textContent = metaText;
    meta.style.display = metaText === "" ? "none" : "";
  }
}

/** 区二 · 厂商行模板：内联 SVG 环（dasharray=已用%、色=view-model 语义色直渲）+
 *  状态句/副行直渲（低水位与紧张态文案均在 view-model 侧定稿，视图不自创）+
 *  右对齐窗口百分比枚举（OpenCode 三枚全量；字段零加工） */
function vendorRowHtml(v) {
  // 官方失败时 ringPct=null：空环不得按 0% 画弧（0 是「一点没用」的视觉编码，未知不是 0）
  var hasPct = typeof v.ringPct === "number";
  var pct = hasPct ? Math.max(0, Math.min(100, v.ringPct)) : 0;
  var percs = (v.percents || []).map(function (p) {
    var val = typeof p.pct === "number" ? p.pct + "%" : "—";
    return '<span class="perc"><i>' + esc(p.label) + '</i><b class="num-t">' + val + "</b></span>";
  }).join("");
  // 弧只在有百分比时生成；环底保留但降透明度（未知态的视觉区分）
  var ring = hasPct
    ? '<g transform="rotate(-90 22 22)"><circle class="ring-fg" cx="22" cy="22" r="15.9" stroke="' + esc(v.ringColor) +
      '" style="stroke-dasharray:' + pct + " " + (RING_C - pct) + '"/></g>'
    : "";
  return '<div class="vendor" data-testid="vendor-row">' +
    '<svg class="ring' + (hasPct ? "" : " ring-empty") + '" viewBox="0 0 44 44" aria-hidden="true">' +
    '<circle class="ring-bg" cx="22" cy="22" r="15.9"/>' +
    ring +
    "</svg>" +
    '<div class="v-info"><div class="v-name">' + esc(v.name) + "</div>" +
    (v.statusText ? '<div class="v-status num-t">' + esc(v.statusText) + "</div>" : "") +
    (v.subText ? '<div class="v-sub">' + esc(v.subText) + "</div>" : "") +
    "</div>" +
    '<div class="v-percs">' + percs + "</div>" +
    "</div>";
}

/** 区二 · 厂商行列表：无实例时给静态占位（未配 provider 的刚装形态） */
function renderVendors(vendors) {
  var list = Array.isArray(vendors) ? vendors : [];
  el("vendor-list").innerHTML = list.length === 0
    ? '<div class="v-empty">暂无额度数据</div>'
    : list.map(vendorRowHtml).join("");
}

/** 区三 · 24h 趋势：view-model 24 点（x=序号、y=token 数）→ 内联 SVG 面积折线坐标换算 */
function renderTrend(trend) {
  trend = trend || {}; // 段缺失防御：display 载荷异常时退化为空折线，不得抛错
  var pts = Array.isArray(trend.points) ? trend.points : [];
  var line = el("trend-line");
  var fill = el("trend-fill");
  if (pts.length < 2) {
    line.setAttribute("d", "");
    fill.setAttribute("d", "");
  } else {
    var W = 640, H = 120, PAD = 6;
    var maxY = 1;
    for (var i = 0; i < pts.length; i++) if (pts[i].y > maxY) maxY = pts[i].y;
    var step = W / (pts.length - 1);
    var d = "";
    for (var j = 0; j < pts.length; j++) {
      var x = (j * step).toFixed(1);
      var y = (H - PAD - (pts[j].y / maxY) * (H - PAD * 2)).toFixed(1);
      d += (j === 0 ? "M" : "L") + x + "," + y;
    }
    line.setAttribute("d", d);
    fill.setAttribute("d", d + "L" + W + "," + H + " L0," + H + " Z");
  }
  setNum(el("trend-foot"), trend.footText === null || trend.footText === undefined ? "" : trend.footText);
}

/** 渲染入口：速率条文本级常刷（数字逐秒可变）；厂商行/趋势按 JSON 差异重建，降低 DOM 抖动。
 *  遮罩只在全部区渲染成功后隐藏（渲染抛错时首帧遮罩保留，由 refresh 回写失败文案）。 */
var booted = false;
var lastVendorsJson = "";
var lastTrendJson = "";
function render(dm) {
  if (!dm || !dm.panel) {
    // 载荷整体畸形（缺 panel 段）：首帧给可读失败文案，不得静默停在「正在连接」
    if (!booted) el("boot").textContent = "数据不可用…（载荷缺少 panel 段）";
    return;
  }
  renderRate(dm.panel.rate);
  var vj = JSON.stringify(dm.panel.vendors);
  if (vj !== lastVendorsJson) { lastVendorsJson = vj; renderVendors(dm.panel.vendors); }
  var tj = JSON.stringify(dm.panel.trend);
  if (tj !== lastTrendJson) { lastTrendJson = tj; renderTrend(dm.panel.trend); }
  var c = dm.panel.conclusion;
  setNum(el("conclusion-line"), c && typeof c.text === "string" ? c.text : "");
  // 全部区渲染完成才撤首帧遮罩（此前任何异常都不会错误隐藏连接提示）
  if (!booted) { booted = true; el("boot").classList.add("hide"); }
}

/**
 * 失败提示（同步不可达/超时）：4s 自动隐没，新一轮提示先清旧计时。
 * 文案「同步失败：官方接口不可达」为简报钉死的视图侧唯一固定交互文案（view-model 不提供）。
 */
var toastTimer = null;
function toast(msg) {
  var t = el("toast");
  t.textContent = msg;
  t.classList.add("show");
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, TOAST_MS);
}

/**
 * 手动同步（§五.4）：read sync 资源 → 扩展侧置待办即时拉取官方额度 → 成功重渲。
 * 拉取中 disabled+旋转图标；10s 超时复位（readResource 悬挂不得永久锁按钮）；失败/超时出中文 toast。
 */
var syncBusy = false;
function doSync() {
  if (syncBusy) return;
  syncBusy = true;
  var btn = el("sync-btn");
  btn.disabled = true;
  btn.classList.add("busy");
  var settled = false;
  var guard = setTimeout(function () { finish(false); }, SYNC_TIMEOUT_MS);
  function finish(ok) {
    if (settled) return;
    settled = true;
    clearTimeout(guard);
    syncBusy = false;
    btn.disabled = false;
    btn.classList.remove("busy");
    if (!ok) toast("同步失败：官方接口不可达");
  }
  readResource("zpowerpack://sync").then(
    function () { finish(true); refresh(); },
    function () { finish(false); }
  );
}
el("sync-btn").addEventListener("click", doSync);

/** 订阅形态探测（真机校准点，暴露性未证实）：readResource 之外的一切可用订阅形态
 *  逐一 typeof 探测、先成功者胜，任何异常/缺位静默跳过——轮询兜底常在，订阅只是加速器。 */
function trySubscribe() {
  var z = window.zcode;
  if (!z) return false;
  var uri = "zpowerpack://display";
  var binds = [
    function () { return typeof z.subscribe === "function" && (z.subscribe(uri, refresh), true); },
    function () { return !!z.resources && typeof z.resources.subscribe === "function" && (z.resources.subscribe(uri, refresh), true); },
    function () { return typeof z.onResourceUpdated === "function" && (z.onResourceUpdated(uri, refresh), true); },
  ];
  for (var i = 0; i < binds.length; i++) {
    try {
      if (binds[i]()) return true;
    } catch (e) {
      /* 静默：候选形态失败不阻塞轮询兜底 */
    }
  }
  return false;
}

/** 数据刷新入口（订阅回调/轮询/同步成功共用）：读 display → 差异渲染。
 *  在飞护栏：1s 轮询与订阅/同步可能同刻触发，前一次未落地时直接跳过，避免读请求叠加。
 *  失败不伪装成空数据：首帧前更新遮罩提示，首帧后静默重试（画面保持最后真值不假动）。 */
var inFlight = false;
function refresh() {
  if (inFlight) return;
  inFlight = true;
  try {
    // 整条链在 try 内构建：readResource 同步 throw / 返回非 Promise 时 finally 未注册，
    // 必须在此捕获复位 inFlight，否则轮询永久锁死在「正在连接」且无任何日志
    readDisplay().then(function (dm) {
      try {
        render(dm);
      } catch (e) {
        // 渲染异常（载荷形状漂移）：首帧遮罩不得错误隐藏，回写可读的失败文案；
        // 启动后异常留痕（console.error），画面保持最后真值不假动
        console.error("[看板] 渲染失败", e);
        if (!booted) el("boot").textContent = "数据渲染失败…（" + (e && e.message ? e.message : "未知错误") + "）";
      }
    }, function (e) {
      if (!booted) el("boot").textContent = "数据通道连接中…（" + (e && e.message ? e.message : "未知错误") + "）";
    }).finally(function () { inFlight = false; });
  } catch (e) {
    inFlight = false;
    if (!booted) el("boot").textContent = "数据通道连接中…（" + (e && e.message ? e.message : "未知错误") + "）";
  }
}

trySubscribe();
refresh();
setInterval(refresh, POLL_FALLBACK_MS);
</script>
</body>
</html>
